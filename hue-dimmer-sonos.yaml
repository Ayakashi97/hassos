alias: "Sonos Smart Controller (Hue Event Fix)"
mode: queued
trigger:
  - platform: state
    entity_id: event.hue_dimmer_switch_2_button_1
    id: play_pause
  - platform: state
    entity_id: event.hue_dimmer_switch_2_button_2
    id: vol_up
  - platform: state
    entity_id: event.hue_dimmer_switch_2_button_3
    id: vol_down
  - platform: state
    entity_id: event.hue_dimmer_switch_2_button_4
    id: playlist
action:
  - choose:
      # --- PLAY / PAUSE (Button 1) ---
      - conditions:
          - condition: trigger
            id: play_pause
          # Only trigger when you LET GO of the button, preventing double-fires
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type == 'short_release' }}"
        sequence:
          - service: media_player.media_play_pause
            target:
              entity_id: media_player.esszimmer_sonos

      # --- VOLUME UP (Button 2) ---
      - conditions:
          - condition: trigger
            id: vol_up
          # Triggers on release, AND smooth scales if you hold it down ('repeat')
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type in ['short_release', 'repeat'] }}"
        sequence:
          - repeat:
              for_each: "{{ state_attr('media_player.esszimmer_sonos', 'group_members') or ['media_player.esszimmer_sonos'] }}"
              sequence:
                - service: media_player.volume_set
                  target:
                    entity_id: "{{ item }}"
                  data:
                    volume_level: >
                      {% set current = state_attr(item, 'volume_level') | float(0.0) %}
                      {% set new_vol = current * 1.15 %}
                      {% if current < 0.02 %}
                        {% set new_vol = current + 0.02 %}
                      {% endif %}
                      {{ [new_vol, 1.0] | min | round(3) }}

      # --- VOLUME DOWN (Button 3) ---
      - conditions:
          - condition: trigger
            id: vol_down
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type in ['short_release', 'repeat'] }}"
        sequence:
          - repeat:
              for_each: "{{ state_attr('media_player.esszimmer_sonos', 'group_members') or ['media_player.esszimmer_sonos'] }}"
              sequence:
                - service: media_player.volume_set
                  target:
                    entity_id: "{{ item }}"
                  data:
                    volume_level: >
                      {% set current = state_attr(item, 'volume_level') | float(0.0) %}
                      {% set new_vol = current * 0.85 %}
                      {{ [new_vol, 0.0] | max | round(3) }}

      # --- CYCLE PLAYLISTS (Button 4) ---
      - conditions:
          - condition: trigger
            id: playlist
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type == 'short_release' }}"
        sequence:
          - service: input_select.select_next
            target:
              entity_id: input_select.sonosplaylists
          - service: media_player.select_source
            target:
              entity_id: media_player.esszimmer_sonos
            data:
              source: "{{ states('input_select.sonosplaylists') }}"
          - service: media_player.media_play
            target:
              entity_id: media_player.esszimmer_sonos
