blueprint:
  name: Hue Dimmer to Sonos (Smart Auto-Detect V4)
  description: "Auto-detects Hue buttons. Proportional volume math compressed to fix whitespace rejection."
  domain: automation
  input:
    controller_sensor:
      name: Controller Sensor
      selector:
        entity:
          domain: sensor
    sonos_player:
      name: Sonos Player
      selector:
        entity:
          domain: media_player
    playlist_helper:
      name: Playlist Dropdown
      selector:
        entity:
          domain: input_select

mode: queued

variables:
  sensor_input: !input controller_sensor
  base_name: "{{ sensor_input | replace('sensor.', '') | replace('_batterie', '') | replace('_battery', '') }}"
  btn_1: "event.{{ base_name }}_button_1"
  btn_2: "event.{{ base_name }}_button_2"
  btn_3: "event.{{ base_name }}_button_3"
  btn_4: "event.{{ base_name }}_button_4"
  sonos_player: !input sonos_player
  playlist_helper: !input playlist_helper

trigger:
  - platform: event
    event_type: state_changed

condition:
  - condition: template
    value_template: "{{ trigger.event.data.entity_id in [btn_1, btn_2, btn_3, btn_4] }}"
  - condition: template
    value_template: >-
      {{ trigger.event.data.new_state is defined and trigger.event.data.new_state.attributes.event_type in ['initial_press', 'repeat'] }}

action:
  - variables:
      trigger_entity: "{{ trigger.event.data.entity_id }}"
      event_type: "{{ trigger.event.data.new_state.attributes.event_type }}"
  - choose:
      # --- BUTTON 1: PLAY/PAUSE ---
      - conditions:
          - condition: template
            value_template: "{{ trigger_entity == btn_1 and event_type == 'initial_press' }}"
        sequence:
          - service: media_player.media_play_pause
            target:
              entity_id: !input sonos_player

      # --- BUTTON 2: VOLUME UP ---
      - conditions:
          - condition: template
            value_template: "{{ trigger_entity == btn_2 }}"
        sequence:
          - repeat:
              for_each: "{{ state_attr(sonos_player, 'group_members') or [sonos_player] }}"
              sequence:
                - service: media_player.volume_set
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    volume_level: >-
                      {% set c = state_attr(repeat.item, 'volume_level') | float(0.0) %}
                      {% set step = [c * 0.15, 0.02] | max %}
                      {{ [c + step, 1.0] | min | round(2) }}

      # --- BUTTON 3: VOLUME DOWN ---
      - conditions:
          - condition: template
            value_template: "{{ trigger_entity == btn_3 }}"
        sequence:
          - repeat:
              for_each: "{{ state_attr(sonos_player, 'group_members') or [sonos_player] }}"
              sequence:
                - service: media_player.volume_set
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    volume_level: >-
                      {% set c = state_attr(repeat.item, 'volume_level') | float(0.0) %}
                      {% set step = [c * 0.15, 0.02] | max %}
                      {{ [c - step, 0.0] | max | round(2) }}

      # --- BUTTON 4: PLAYLIST CYCLE ---
      - conditions:
          - condition: template
            value_template: "{{ trigger_entity == btn_4 and event_type == 'initial_press' }}"
        sequence:
          - service: input_select.select_next
            target:
              entity_id: !input playlist_helper
          - service: media_player.select_source
            target:
              entity_id: !input sonos_player
            data:
              source: "{{ states(playlist_helper) }}"
          - service: media_player.media_play
            target:
              entity_id: !input sonos_player
