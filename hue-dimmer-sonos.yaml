alias: "Sonos Controller: Hue Dimmer"
mode: queued
trigger:
  - platform: state
    entity_id: event.hue_dimmer_switch_2_button_1
    attribute: event_type
    to: "initial_press"
    id: play_pause
  - platform: state
    entity_id: event.hue_dimmer_switch_2_button_2
    attribute: event_type
    to:
      - "initial_press"
      - "repeat"
    id: vol_up
  - platform: state
    entity_id: event.hue_dimmer_switch_2_button_3
    attribute: event_type
    to:
      - "initial_press"
      - "repeat"
    id: vol_down
  - platform: state
    entity_id: event.hue_dimmer_switch_2_button_4
    attribute: event_type
    to: "initial_press"
    id: playlist
action:
  - choose:
      # --- PLAY / PAUSE ---
      - conditions:
          - condition: trigger
            id: play_pause
        sequence:
          - service: media_player.media_play_pause
            target:
              entity_id: media_player.YOUR_SONOS

      # --- VOLUME UP (Proportional + Hold Support) ---
      - conditions:
          - condition: trigger
            id: vol_up
        sequence:
          - repeat:
              for_each: "{{ state_attr('media_player.YOUR_SONOS', 'group_members') or ['media_player.YOUR_SONOS'] }}"
              sequence:
                - service: media_player.volume_set
                  target:
                    entity_id: "{{ item }}"
                  data:
                    volume_level: >
                      {% set current = state_attr(item, 'volume_level') | float(0.0) %} 
                      {% set new_vol = current * 1.15 %} 
                      {% if current < 0.02 %} 
                        {% set new_vol = current + 0.02 %} 
                      {% endif %} 
                      {{ [new_vol, 1.0] | min | round(3) }}

      # --- VOLUME DOWN (Proportional + Hold Support) ---
      - conditions:
          - condition: trigger
            id: vol_down
        sequence:
          - repeat:
              for_each: "{{ state_attr('media_player.YOUR_SONOS', 'group_members') or ['media_player.YOUR_SONOS'] }}"
              sequence:
                - service: media_player.volume_set
                  target:
                    entity_id: "{{ item }}"
                  data:
                    volume_level: >
                      {% set current = state_attr(item, 'volume_level') | float(0.0) %} 
                      {% set new_vol = current * 0.85 %} 
                      {{ [new_vol, 0.0] | max | round(3) }}

      # --- CYCLE PLAYLISTS ---
      - conditions:
          - condition: trigger
            id: playlist
        sequence:
          - service: input_select.select_next
            target:
              entity_id: input_select.sonos_playlists
          - service: media_player.select_source
            target:
              entity_id: media_player.YOUR_SONOS
            data:
              source: "{{ states('input_select.sonos_playlists') }}"
          - service: media_player.media_play
            target:
              entity_id: media_player.YOUR_SONOS
