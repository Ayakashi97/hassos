blueprint:
  name: Hue Dimmer to Sonos (Smart Proportional Volume & Playlists)
  description: "Controls a Sonos group with a Hue Dimmer switch. Volume adjustments scale proportionally across all grouped speakers! Cycles through a dropdown of predefined playlists."
  domain: automation
  input:
    controller_sensor:
      name: Hue Dimmer Action Sensor
      description: The sensor entity of your Hue dimmer that registers button presses (e.g., from Zigbee2MQTT, ZHA, or Hue).
      selector:
        entity:
          domain: sensor
    play_pause_action:
      name: Play/Pause Button Action String
      description: The state string your switch outputs when the top button is pressed (e.g., 'on_press', 'step_up', 'button_1_press').
      default: "on_press"
    vol_up_action:
      name: Volume Up Action String
      default: "up_press"
    vol_down_action:
      name: Volume Down Action String
      default: "down_press"
    playlist_action:
      name: Playlist Cycle Action String
      description: The action string for the bottom Hue button.
      default: "off_press"
    sonos_player:
      name: Sonos Media Player
      description: The primary Sonos speaker to control. The automation will automatically detect all grouped speakers!
      selector:
        entity:
          domain: media_player
    playlist_helper:
      name: Playlist Input Select
      description: The Dropdown Helper you created containing your Sonos favorites.
      selector:
        entity:
          domain: input_select
    volume_step:
      name: Volume Scale Percentage
      description: The percentage by which to scale the volume up or down (e.g. 15%).
      default: 15
      selector:
        number:
          min: 5
          max: 100
          unit_of_measurement: "%"

mode: restart

variables:
  controller: !input controller_sensor
  player: !input sonos_player
  playlist_helper: !input playlist_helper
  vol_step: !input volume_step
  # Automatically grabs all speakers grouped with this one, or just this one if playing solo
  group_members: "{{ state_attr(player, 'group_members') or [player] }}"

trigger:
  - platform: state
    entity_id: !input controller_sensor
    to: !input play_pause_action
    id: "play_pause"
  - platform: state
    entity_id: !input controller_sensor
    to: !input vol_up_action
    id: "vol_up"
  - platform: state
    entity_id: !input controller_sensor
    to: !input vol_down_action
    id: "vol_down"
  - platform: state
    entity_id: !input controller_sensor
    to: !input playlist_action
    id: "playlist"

action:
  - choose:
      # --- PLAY / PAUSE ---
      - conditions:
          - condition: trigger
            id: "play_pause"
        sequence:
          - service: media_player.media_play_pause
            target:
              entity_id: !input sonos_player

      # --- VOLUME UP (Proportional) ---
      - conditions:
          - condition: trigger
            id: "vol_up"
        sequence:
          - repeat:
              for_each: "{{ group_members }}"
              sequence:
                - service: media_player.volume_set
                  target:
                    entity_id: "{{ item }}"
                  data:
                    volume_level: >
                      {% set current = state_attr(item, 'volume_level') | float(0.0) %}
                      {% set step = (vol_step | float) / 100.0 %}
                      {% set new_vol = current * (1.0 + step) %}
                      {# Give it a tiny flat bump if the speaker was at 0% so it doesn't get stuck doing 0 * 1.15 #}
                      {% if current < 0.02 %}
                        {% set new_vol = current + 0.02 %}
                      {% endif %}
                      {{ [new_vol, 1.0] | min | round(3) }}

      # --- VOLUME DOWN (Proportional) ---
      - conditions:
          - condition: trigger
            id: "vol_down"
        sequence:
          - repeat:
              for_each: "{{ group_members }}"
              sequence:
                - service: media_player.volume_set
                  target:
                    entity_id: "{{ item }}"
                  data:
                    volume_level: >
                      {% set current = state_attr(item, 'volume_level') | float(0.0) %}
                      {% set step = (vol_step | float) / 100.0 %}
                      {% set new_vol = current * (1.0 - step) %}
                      {{ [new_vol, 0.0] | max | round(3) }}

      # --- CYCLE PLAYLISTS ---
      - conditions:
          - condition: trigger
            id: "playlist"
        sequence:
          - service: input_select.select_next
            target:
              entity_id: !input playlist_helper
          - service: media_player.select_source
            target:
              entity_id: !input sonos_player
            data:
              source: "{{ states(playlist_helper) }}"
          - service: media_player.media_play
            target:
              entity_id: !input sonos_player
