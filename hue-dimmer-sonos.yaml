blueprint:
  name: Hue Dimmer to Sonos (Smart Auto-Detect)
  description: "Provide your battery sensor and this blueprint automatically extracts the name to map all 4 buttons dynamically. Fixes the double-fire volume bug!"
  domain: automation
  input:
    controller_sensor:
      name: Controller Sensor
      description: The battery sensor (e.g., sensor.hue_dimmer_switch_2_batterie)
      selector:
        entity:
          domain: sensor
    sonos_player:
      name: Sonos Player
      selector:
        entity:
          domain: media_player
    playlist_helper:
      name: Playlist Dropdown
      selector:
        entity:
          domain: input_select

mode: queued

variables:
  sensor_input: !input controller_sensor
  # Magically extracts "hue_dimmer_switch_2" from "sensor.hue_dimmer_switch_2_batterie"
  base_name: "{{ sensor_input | replace('sensor.', '') | replace('_batterie', '') | replace('_battery', '') }}"
  btn_1: "event.{{ base_name }}_button_1"
  btn_2: "event.{{ base_name }}_button_2"
  btn_3: "event.{{ base_name }}_button_3"
  btn_4: "event.{{ base_name }}_button_4"
  sonos_player: !input sonos_player
  playlist_helper: !input playlist_helper
  # Auto-detects all grouped speakers for proportional volume
  group_members: "{{ state_attr(sonos_player, 'group_members') or [sonos_player] }}"

trigger:
  # Listening to the global state_changed bus to bypass HA's strict trigger limitations
  - platform: event
    event_type: state_changed

condition:
  # Filter 1: Did one of our 4 dynamically calculated buttons trigger this event?
  - condition: template
    value_template: "{{ trigger.event.data.entity_id in [btn_1, btn_2, btn_3, btn_4] }}"
  # Filter 2: Ignore double-fires by only accepting initial press or hold repeats
  - condition: template
    value_template: >
      {{ trigger.event.data.new_state is defined and trigger.event.data.new_state.attributes.event_type in ['initial_press', 'repeat'] }}

action:
  - variables:
      trigger_entity: "{{ trigger.event.data.entity_id }}"
      event_type: "{{ trigger.event.data.new_state.attributes.event_type }}"
  - choose:
      # --- BUTTON 1: PLAY/PAUSE ---
      - conditions:
          - condition: template
            value_template: "{{ trigger_entity == btn_1 }}"
          - condition: template
            value_template: "{{ event_type == 'initial_press' }}"
        sequence:
          - service: media_player.media_play_pause
            target:
              entity_id: !input sonos_player

      # --- BUTTON 2: VOLUME UP (Proportional 15% + Hold Support) ---
      - conditions:
          - condition: template
            value_template: "{{ trigger_entity == btn_2 }}"
        sequence:
          - repeat:
              for_each: "{{ group_members }}"
              sequence:
                - service: media_player.volume_set
                  target:
                    entity_id: "{{ item }}"
                  data:
                    volume_level: >
                      {% set current = state_attr(item, 'volume_level') | float(0.0) %}
                      {% set new_vol = current * 1.15 %}
                      {% if current < 0.02 %}
                        {% set new_vol = current + 0.02 %}
                      {% endif %}
                      {{ [new_vol, 1.0] | min | round(3) }}

      # --- BUTTON 3: VOLUME DOWN (Proportional 15% + Hold Support) ---
      - conditions:
          - condition: template
            value_template: "{{ trigger_entity == btn_3 }}"
        sequence:
          - repeat:
              for_each: "{{ group_members }}"
              sequence:
                - service: media_player.volume_set
                  target:
                    entity_id: "{{ item }}"
                  data:
                    volume_level: >
                      {% set current = state_attr(item, 'volume_level') | float(0.0) %}
                      {% set new_vol = current * 0.85 %}
                      {{ [new_vol, 0.0] | max | round(3) }}

      # --- BUTTON 4: PLAYLIST CYCLE ---
      - conditions:
          - condition: template
            value_template: "{{ trigger_entity == btn_4 }}"
          - condition: template
            value_template: "{{ event_type == 'initial_press' }}"
        sequence:
          - service: input_select.select_next
            target:
              entity_id: !input playlist_helper
          - service: media_player.select_source
            target:
              entity_id: !input sonos_player
            data:
              source: "{{ states(playlist_helper) }}"
          - service: media_player.media_play
            target:
              entity_id: !input sonos_player
