blueprint:
  name: Native Hue Tap Dial - Smart Select & Toggle
  description: >
    Control 4 different lights (or groups) with a Philips Hue Tap Dial via the Native Hue integration. 
    First press selects the light and turns it on. Pressing the button again toggles it off.
    Rotating the dial dims the *last selected light*.
  domain: automation
  input:
    device:
      name: Philips Hue Tap Dial Switch
      selector:
        device:
          filter:
            - integration: hue
    helper_input:
      name: Active Light Tracker (Input Text Helper)
      selector:
        entity:
          domain: input_text
    light_1:
      name: Light 1 (One Dot Button)
      selector:
        entity:
          domain: light
    light_2:
      name: Light 2 (Two Dots Button)
      selector:
        entity:
          domain: light
    light_3:
      name: Light 3 (Three Dots Button)
      selector:
        entity:
          domain: light
    light_4:
      name: Light 4 (Four Dots Button)
      selector:
        entity:
          domain: light

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: hue_event
    event_data:
      device_id: !input device

action:
  - variables:
      configured_helper: !input helper_input
      l1: !input light_1
      l2: !input light_2
      l3: !input light_3
      l4: !input light_4

  - choose:
      # ==============================
      # BUTTON 1
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type == 'initial_press' and trigger.event.data.subtype | int == 1 }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(configured_helper) == l1 }}"
            then:
              - service: light.toggle
                target:
                  entity_id: !input light_1
            else:
              - service: input_text.set_value
                target:
                  entity_id: !input helper_input
                data:
                  value: !input light_1
              - service: light.turn_on
                target:
                  entity_id: !input light_1

      # ==============================
      # BUTTON 2
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type == 'initial_press' and trigger.event.data.subtype | int == 2 }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(configured_helper) == l2 }}"
            then:
              - service: light.toggle
                target:
                  entity_id: !input light_2
            else:
              - service: input_text.set_value
                target:
                  entity_id: !input helper_input
                data:
                  value: !input light_2
              - service: light.turn_on
                target:
                  entity_id: !input light_2

      # ==============================
      # BUTTON 3
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type == 'initial_press' and trigger.event.data.subtype | int == 3 }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(configured_helper) == l3 }}"
            then:
              - service: light.toggle
                target:
                  entity_id: !input light_3
            else:
              - service: input_text.set_value
                target:
                  entity_id: !input helper_input
                data:
                  value: !input light_3
              - service: light.turn_on
                target:
                  entity_id: !input light_3

      # ==============================
      # BUTTON 4
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type == 'initial_press' and trigger.event.data.subtype | int == 4 }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(configured_helper) == l4 }}"
            then:
              - service: light.toggle
                target:
                  entity_id: !input light_4
            else:
              - service: input_text.set_value
                target:
                  entity_id: !input helper_input
                data:
                  value: !input light_4
              - service: light.turn_on
                target:
                  entity_id: !input light_4

      # ==============================
      # DIAL: CLOCKWISE (Dim Up)
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.subtype == 'clock_wise' and trigger.event.data.steps is defined }}"
          - condition: template
            value_template: >
              {% set helper = states(configured_helper) %}
              {{ helper != 'unknown' and helper != '' }}
        sequence:
          - service: light.turn_on
            target:
              entity_id: "{{ states(configured_helper) }}"
            data:
              brightness_step_pct: "{{ (trigger.event.data.steps / 2.55) | round(0) | int }}"

      # ==============================
      # DIAL: COUNTER-CLOCKWISE (Dim Down)
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.subtype == 'counter_clock_wise' and trigger.event.data.steps is defined }}"
          - condition: template
            value_template: >
              {% set helper = states(configured_helper) %}
              {{ helper != 'unknown' and helper != '' }}
        sequence:
          - service: light.turn_on
            target:
              entity_id: "{{ states(configured_helper) }}"
            data:
              brightness_step_pct: "{{ ((trigger.event.data.steps / 2.55) * -1) | round(0) | int }}"
