blueprint:
  name: Native Hue Tap Dial - Lights & Dimming Only
  description: >
    Control 4 different lights (or groups) with a Philips Hue Tap Dial via the Native Hue integration. 
    Pressing a button toggles the respective light. Rotating the dial dims the *last selected light*.

    **Requirement:** Create an `input_text` helper (Settings > Devices & Services > Helpers) and select it below so the switch can remember which light to dim.
  domain: automation
  input:
    device:
      name: Philips Hue Tap Dial Switch
      selector:
        device:
          filter:
            - integration: hue
    helper_input:
      name: Active Light Tracker (Input Text Helper)
      description: Required! Select the Input Text helper you created to save the active light.
      selector:
        entity:
          domain: input_text
    light_1:
      name: Light 1 (One Dot Button)
      selector:
        entity:
          domain: light
    light_2:
      name: Light 2 (Two Dots Button)
      selector:
        entity:
          domain: light
    light_3:
      name: Light 3 (Three Dots Button)
      selector:
        entity:
          domain: light
    light_4:
      name: Light 4 (Four Dots Button)
      selector:
        entity:
          domain: light

# Restart mode ensures that fast spinning of the dial doesn't get blocked
mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: hue_event
    event_data:
      device_id: !input device

action:
  - variables:
      light_1: !input light_1
      light_2: !input light_2
      light_3: !input light_3
      light_4: !input light_4
      helper_input: !input helper_input
      
      # Extract data from the native hue_event
      event_type: "{{ trigger.event.data.type | default('') }}"
      event_subtype: "{{ trigger.event.data.subtype | string }}"
      event_steps: "{{ trigger.event.data.steps | default(45) | int }}"
      
      # Calculate brightness step percentage (Hue outputs high step numbers. steps/15 scales it perfectly to 1-100%)
      step_pct: "{{ (event_steps / 15) | round(0, 'ceil') | int }}"

  - choose:
      # ==============================
      # BUTTON 1
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ event_type == 'initial_press' and event_subtype == '1' }}"
        sequence:
          - service: input_text.set_value
            target:
              entity_id: !input helper_input
            data:
              value: !input light_1
          - service: light.toggle
            target:
              entity_id: !input light_1

      # ==============================
      # BUTTON 2
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ event_type == 'initial_press' and event_subtype == '2' }}"
        sequence:
          - service: input_text.set_value
            target:
              entity_id: !input helper_input
            data:
              value: !input light_2
          - service: light.toggle
            target:
              entity_id: !input light_2

      # ==============================
      # BUTTON 3
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ event_type == 'initial_press' and event_subtype == '3' }}"
        sequence:
          - service: input_text.set_value
            target:
              entity_id: !input helper_input
            data:
              value: !input light_3
          - service: light.toggle
            target:
              entity_id: !input light_3

      # ==============================
      # BUTTON 4
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ event_type == 'initial_press' and event_subtype == '4' }}"
        sequence:
          - service: input_text.set_value
            target:
              entity_id: !input helper_input
            data:
              value: !input light_4
          - service: light.toggle
            target:
              entity_id: !input light_4

      # ==============================
      # DIAL: CLOCKWISE (Dim Up)
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ event_subtype == 'clock_wise' }}"
          - condition: template
            value_template: "{{ states(helper_input) != 'unknown' and states(helper_input) != '' }}"
        sequence:
          - service: light.turn_on
            target:
              entity_id: "{{ states(helper_input) }}"
            data:
              brightness_step_pct: "{{ step_pct }}"

      # ==============================
      # DIAL: COUNTER-CLOCKWISE (Dim Down)
      # ==============================
      - conditions:
          - condition: template
            value_template: "{{ event_subtype == 'counter_clock_wise' }}"
          - condition: template
            value_template: "{{ states(helper_input) != 'unknown' and states(helper_input) != '' }}"
        sequence:
          - service: light.turn_on
            target:
              entity_id: "{{ states(helper_input) }}"
            data:
              brightness_step_pct: "{{ step_pct * -1 }}"
